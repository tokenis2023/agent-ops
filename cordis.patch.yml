# fsops bundle：把 fs_* 工具注册进 Harness。
# name 用包名解析（安装后位于 profile 的 node_modules），根导出指向 dsh/index.js。
#
# 可选配置（在 profile 的 cordis.patch.yml 里按 id 覆盖）：
#   binary: 指向已有的 fsops.exe 绝对路径
#   version: 覆盖下载版本（默认与 package.json 一致）
#   autoDownload: false 关闭自动下载
- insert:
    - id: fsops-tools
      name: '@tokenis2023/fsops'
