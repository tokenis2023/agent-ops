name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test

      - name: 构建测试二进制
        run: cargo build

      # 单独成步：漂移时先于冒烟失败，错误信息更直接（冒烟里也含这项断言）。
      # 工具定义只有 Rust 一份真源，DSH 的 tool-specs 必须与 `fsops schema` 逐字一致。
      - name: DSH 工具定义与 Rust 真源一致
        run: node scripts/gen_dsh_specs.mjs --check --exe target/debug/fsops.exe

      # 文档里的工具清单与数量也来自 fsops schema：加工具时漏改 README/工具参考/package.json
      # 会在这里红灯（v0.9.0 加 fs_inspect 时就有 4 处漏改）。
      - name: 文档工具清单与 Rust 真源一致
        run: node scripts/gen_docs_tools.mjs --check --exe target/debug/fsops.exe

      # 覆盖：包清单、DSH schema DSL、参数集合对齐、插件形态裁剪（schema/描述/运行时三方）、
      # 真实调用链路、并发不串号、长驻会话复用与重建、取消语义、env 注入。
      - name: DSH 插件冒烟测试
        run: node tests/dsh_plugin_smoke.mjs --exe target/debug/fsops.exe

      - name: 真实 MCP 端到端测试
        run: python tests/windows_semantics.py

      - name: 构建 debug 基准二进制
        run: cargo build

      - name: 任务级基准
        run: python tests/task_bench.py

      - name: 基准脚本自检
        run: python tests/bench.py

      - name: 版本一致性
        run: python scripts/release.py check

      - name: 发布工具自检
        run: python tests/release_tooling.py

      # 发布产物必须能过同一套冒烟：避免 `cargo build --release` 与 debug 行为分叉
      # （优化后曾出现 instances of UB / 条件编译差异）。
      - name: 构建 release 二进制
        run: cargo build --release

      - name: release 二进制过插件冒烟
        run: node tests/dsh_plugin_smoke.mjs --exe target/release/fsops.exe
