name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test

      - name: 构建测试二进制
        run: cargo build

      - name: DSH 插件冒烟测试
        run: node tests/dsh_plugin_smoke.mjs --exe target/debug/fsops.exe

      - name: 真实 MCP 端到端测试
        run: python tests/windows_semantics.py

      - name: 构建 debug 基准二进制
        run: cargo build

      - name: 任务级基准
        run: python tests/task_bench.py

      - name: 基准脚本自检
        run: python tests/bench.py
