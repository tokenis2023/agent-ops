name: Feature request
description: 提议新能力或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的 Agent 工作流问题
      description: 描述实际任务、当前卡点和 token/轮次成本
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 优先说明能否并入现有 6 个工具，而不是新增工具
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该能力不是单纯删除/移动/复制目录
          required: true
        - label: 已说明对 token、并发或安全的影响
          required: true
